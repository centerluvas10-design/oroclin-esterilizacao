<style>
/* Layout: barra superior fixa com abas; coluna única de até 1120px; cada aba é uma ferramenta de trabalho da sala de esterilização */
:root{ color-scheme:light;
  --bg:#f6f6f4; --surface:#ffffff; --sunken:#efeee9; --line:#dedcd4; --line-strong:#c6c2b5;
  --fg:#17150f; --muted:#5f5b50; --faint:#8a8576;
  --gold:#9a6b14; --gold-soft:#f3e8cf; --gold-ink:#5c3f08;
  --ink-btn:#17150f; --ink-btn-fg:#ffffff;
  --ok:#2f6b2a; --ok-soft:#e3f0de; --warn:#8a5a00; --warn-soft:#fbefd2; --crit:#a3241f; --crit-soft:#f9e1df; --info:#1f4f86; --info-soft:#e2ecf8;
  --label-bg:#ffffff; --label-fg:#000000;
  --f-display:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Public Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --surface:#1b1a17; --sunken:#24221e; --line:#34312a; --line-strong:#4a463c;
  --fg:#f1eee6; --muted:#b4ae9f; --faint:#878171;
  --gold:#d9ac52; --gold-soft:#3a2e15; --gold-ink:#f2d595;
  --ink-btn:#d9ac52; --ink-btn-fg:#17150f;
  --ok:#8fcf86; --ok-soft:#1f3320; --warn:#e8bd5c; --warn-soft:#3a2f14; --crit:#f08a82; --crit-soft:#3d1d1b; --info:#8db8ec; --info-soft:#1a2a3e;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1b1a17; --sunken:#24221e; --line:#34312a; --line-strong:#4a463c;
  --fg:#f1eee6; --muted:#b4ae9f; --faint:#878171;
  --gold:#d9ac52; --gold-soft:#3a2e15; --gold-ink:#f2d595;
  --ink-btn:#d9ac52; --ink-btn-fg:#17150f;
  --ok:#8fcf86; --ok-soft:#1f3320; --warn:#e8bd5c; --warn-soft:#3a2f14; --crit:#f08a82; --crit-soft:#3d1d1b; --info:#8db8ec; --info-soft:#1a2a3e;
  color-scheme:dark }
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;padding-block:12px 6px;flex-wrap:wrap}
.brand .logo{height:56px;width:auto;display:block}
.brand span{font-family:var(--f-display);font-weight:600;font-size:16px;padding-left:14px;border-left:1px solid var(--line-strong)}
.brand small{color:var(--faint);font-size:12px;margin-left:auto}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font:500 14px var(--f-body);background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 12px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--gold)}
nav.tabs button:hover{color:var(--fg)}
main{padding-block:22px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:24px;font-weight:600}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
.lede{color:var(--muted);margin:4px 0 0;max-width:68ch}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile .n{font:600 28px var(--f-display);font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{color:var(--muted);font-size:13px}
.tile.warn .n{color:var(--warn)} .tile.crit .n{color:var(--crit)}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);border-left:4px solid;font-size:14px}
.alert.ok{background:var(--ok-soft);border-color:var(--ok)} .alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert.crit{background:var(--crit-soft);border-color:var(--crit)} .alert.info{background:var(--info-soft);border-color:var(--info)}
.alert b{font-weight:600}
.alert .grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--sunken);color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;background:var(--sunken);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunken)}
.num{text-align:right;font-variant-numeric:tabular-nums}
button,.btn{font:500 14px var(--f-body);border-radius:6px;padding:8px 14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{background:var(--sunken)}
button.primary{background:var(--ink-btn);color:var(--ink-btn-fg);border-color:var(--ink-btn)}
button.primary:hover{opacity:.9;background:var(--ink-btn)}
button.gold{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
button.danger{color:var(--crit);border-color:var(--crit)}
button.small{padding:4px 10px;font-size:13px}
button.link{border:0;background:none;padding:0;color:var(--gold);text-decoration:underline;text-underline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{font:400 14.5px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
@media (min-width:761px) and (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;margin:0;min-width:0}
legend{font:600 14px var(--f-display);padding:0 6px}
.hint{font-size:12.5px;color:var(--faint)}
.art{font-family:var(--f-mono);font-size:11.5px;color:var(--gold);white-space:nowrap}
.pk-row{display:grid;grid-template-columns:2fr 2.4fr .7fr 1.4fr 1.5fr auto;gap:8px;align-items:end;padding:10px 0;border-bottom:1px dashed var(--line)}
@media (max-width:900px){.pk-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pk-row .wide{grid-column:1/-1}}
.empty{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);margin-bottom:4px}
.kv{display:grid;grid-template-columns:minmax(150px,max-content) minmax(0,1fr);gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
@media (max-width:520px){.kv{grid-template-columns:minmax(0,1fr)}.kv dt{margin-top:6px}}
.labels{display:flex;flex-wrap:wrap;gap:12px}
.lbl{background:var(--label-bg);color:var(--label-fg);border:1px solid #bdbdbd;border-radius:3px;display:flex;gap:6px;padding:6px;font-family:Arial,Helvetica,sans-serif;width:250px;height:150px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.lbl .qr{flex:0 0 96px;display:flex;flex-direction:column;align-items:center;gap:3px}
.lbl .qr svg{width:96px;height:96px}
.lbl .code{font:600 9px "JetBrains Mono",monospace;letter-spacing:-.02em}
.lbl .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:10.5px;line-height:1.25}
.lbl .t .h{font-weight:700;font-size:10px;letter-spacing:.08em}
.lbl .t .k{font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl .t .it{font-size:8.5px;max-height:22px;overflow:hidden}
.pin{max-width:380px;margin:8vh auto 0}
.pin input{font:600 22px var(--f-mono);letter-spacing:.2em;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.banner{background:var(--warn-soft);color:var(--fg);border-bottom:1px solid var(--line);font-size:13.5px}
.banner .wrap{padding-block:8px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.confirm{background:var(--crit-soft);border:1px solid var(--crit);border-radius:var(--r);padding:12px}
.scan{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:end}
@media (max-width:600px){.scan{grid-template-columns:minmax(0,1fr)}}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.tile,.panel{transition:border-color .15s}}
</style>

</head>

const API_URL = "https://script.google.com/macros/s/AKfycbzjkyz1UCYRD88l8FZAo9df-DTmj9GxfJdv45kJ7wFObz654Fv8a8HOyCREspGkCSum/exec";
const PIN_KEY = "oroclin-esterilizacao-pin";
let pin = null, canWrite = true, online = false;
const lsGet = k => { try { return localStorage.getItem(k); } catch(_){ return null; } };
const lsSet = (k,v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(_){} };
async function api(acao, dados){
  let r;
  try { r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({acao, pin, ...dados})}); }
  catch(_){ throw {code:"unavailable", message:"Sem conexão com o servidor."}; }
  if (!r.ok) throw {code:"unavailable", message:"Servidor indisponível ("+r.status+")."};
  let j; try { j = await r.json(); } catch(_){ throw {code:"unavailable", message:"Resposta inválida do servidor. Confira a URL do App da Web."}; }
  if (j.erro){ if (j.codigo === "pin" && lsGet(PIN_KEY)){ lsSet(PIN_KEY, null); pin = null; askPin("O código de acesso mudou. Digite o novo código."); } throw {code:j.codigo, message:j.erro}; }
  return j.resultado;
}
const sortCargas = arr => arr.sort((a,b) => (b.criadoEm||"") < (a.criadoEm||"") ? -1 : 1);

/* ---------- utilidades ---------- */

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const isoToday = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const parseISO = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m-1, d); };
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const br = s => { if(!s) return "—"; const [y,m,d] = String(s).split("-"); return `${d}/${m}/${y}`; };
const brShort = s => { if(!s) return "—"; const [y,m,d] = String(s).split("-"); return `${d}/${m}/${y.slice(2)}`; };
function addMonths(iso, n){ const d = parseISO(iso); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n);
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); return toISO(d); }
const daysBetween = (a,b) => Math.round((parseISO(b)-parseISO(a))/86400000);
function weekStart(iso){ const d = parseISO(iso); const wd = (d.getDay()+6)%7; d.setDate(d.getDate()-wd); return toISO(d); }

/* ---------- regras de status ---------- */
const CARGA_STATUS = {
  preparada:["Aguardando ciclo","info"], liberada:["Liberada","ok"], liberada_ib:["Liberada · IB em leitura","warn"],
  reprovada:["Reprovada","crit"], cancelada:["Cancelada","neutral"] };
function cargaPill(c){ const [t,k] = CARGA_STATUS[c.status] || [c.status,"neutral"]; return `<span class="pill ${k}">${esc(t)}</span>`; }
function pkgStatus(c, p){
  const uso = (c.usos||{})[p.codigo];
  if (c.status === "cancelada") return {k:"neutral", t:"Cancelado"};
  if (uso) return uso.desfecho === "utilizado" ? {k:"neutral", t:"Utilizado", uso} : {k:"neutral", t: uso.desfecho === "descartado" ? "Descartado" : "Reprocessar", uso};
  if (c.status === "reprovada") return {k:"crit", t:"Recolher — carga reprovada"};
  if (c.status === "preparada") return {k:"info", t:"Aguardando ciclo"};
  const today = isoToday();
  if (c.validade < today) return {k:"crit", t:"Vencido — reprocessar"};
  if (daysBetween(today, c.validade) <= 30) return {k:"warn", t:"Vence em "+daysBetween(today,c.validade)+" d"};
  return {k:"ok", t:"Disponível"};
}
function computeStatus(ciclo){
  if (!ciclo) return "preparada";
  const fail = ciclo.integrador?.resultado === "reprovado" || ciclo.bowieDick === "reprovado" || ciclo.ib?.resultado === "positivo";
  if (fail) return "reprovada";
  if (ciclo.ib?.usado && ciclo.ib?.resultado === "pendente") return "liberada_ib";
  return "liberada";
}

const qrUrl = code => location.origin + location.pathname + "#" + code;
function qrMatrix(text){ const q = qrcode(0,"M"); q.addData(text); q.make(); const n = q.getModuleCount();
  return {n, dark:(r,c)=>q.isDark(r,c)}; }
function qrSvg(text){ const m = qrMatrix(text); let d = "";
  for(let r=0;r<m.n;r++) for(let c=0;c<m.n;c++) if(m.dark(r,c)) d += `M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="-1 -1 ${m.n+2} ${m.n+2}" shape-rendering="crispEdges" role="img" aria-label="QR ${esc(text)}"><rect x="-1" y="-1" width="${m.n+2}" height="${m.n+2}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`; }

function setBanner(msg){ $("#banner").hidden = !msg; $("#bannerTxt").textContent = msg || ""; }
function startRoute(){
  const h = decodeURIComponent(location.hash.replace("#",""));
  const m = h.match(CODE_RE);
  if (m){ S.lookupCode = m[0].toUpperCase(); route("consulta"); }
  else route(h || "painel");
}
function askPin(msg){
  $("#tabs").hidden = true;
  $("#main").innerHTML = `<form id="pinForm" class="panel stack pin" novalidate>
    <div><h1>Código de acesso</h1><p class="lede">Digite o código da clínica. Ele fica guardado neste aparelho e só é pedido de novo se for trocado.</p></div>
    <label class="f">Código<input id="pinIn" type="password" inputmode="numeric" autocomplete="off" required></label>
    <div id="pinErr">${msg?`<div class="alert warn"><div class="grow">${esc(msg)}</div></div>`:""}</div>
    <button type="submit" class="primary">Entrar</button></form>`;
  $("#pinIn").focus();
  $("#pinForm").addEventListener("submit", async e => {
    e.preventDefault(); pin = $("#pinIn").value.trim(); if (!pin) return;
    const b = e.target.querySelector("button"); b.disabled = true; b.textContent = "Verificando…";
    try { await api("ping", {}); lsSet(PIN_KEY, pin); $("#tabs").hidden = false; startRoute(); sync(); }
    catch(err){ b.disabled = false; b.textContent = "Entrar"; pin = null; $("#pinErr").innerHTML = `<div class="alert crit"><div class="grow">${esc(err.code === "pin" ? "Código incorreto." : err.message)}</div></div>`; }
  });
}
async function boot(){
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL)){
    $("#tabs").hidden = true;
    $("#main").innerHTML = `<div class="panel stack"><h1>Falta conectar a planilha</h1><p class="lede">Abra o arquivo <b>index.html</b>, procure <span class="mono">API_URL</span> e cole a URL do App da Web do Google Apps Script. O passo a passo está no README do repositório.</p></div>`;
    return;
  }
  pin = lsGet(PIN_KEY);
  if (!pin) return askPin();
  startRoute(); sync();
  setInterval(() => { if (document.visibilityState === "visible" && pin) sync(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && pin) sync(); });
}
async function sync(){
  try {
    const r = await api("tudo", {});
    S.equip = r.equipamentos || []; S.pessoas = r.pessoas || []; S.kits = r.kits || [];
    S.cargas = sortCargas(r.cargas || []); S.config = {...S.config, ...(r.config || {})};
    S.loaded.all = true; online = true; setBanner(""); refresh();
  } catch(e){
    if (e.code === "pin") return;
    online = false; S.loaded.all = true;
    setBanner("Sem conexão com a planilha da clínica. Os dados mostrados podem estar desatualizados e nada pode ser salvo até a conexão voltar.");
    refresh();
  }
}
function upsertLocal(c){ const i = S.cargas.findIndex(x=>x.lote===c.lote); if (i>=0) S.cargas[i] = c; else S.cargas.unshift(c); sortCargas(S.cargas); }
async function write(fn, okMsg){
  if (!pin){ askPin(); return false; }
  try { const r = await fn(); if (okMsg) toast(typeof okMsg === "function" ? okMsg(r) : okMsg); sync(); return r || true; }
  catch(e){
    if (e?.code === "pin") return false;
    if (e?.code === "quota_exceeded") toast(e.message);
    else if (e?.code === "unavailable") toast("Sem conexão com a planilha. Nada foi salvo; tente de novo em instantes.");
    else toast("Não foi possível salvar: " + (e?.message || e));
    return false;
  }
}
function save(filename, data){
  const blob = data instanceof Blob ? data : new Blob([data], {type: filename.endsWith(".csv") ? "text/csv;charset=utf-8" : "application/octet-stream"});
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

const VIEWS = {painel:mountPainel, cargas:mountCargas, consulta:mountConsulta, registros:mountRegistros, cadastros:mountCadastros};
function route(v){
  if (!VIEWS[v]) v = "painel";
  S.view = v;
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.view===v ? "page" : "false"));
  try { history.replaceState(null,"", v==="consulta" && S.lookupCode ? "#"+S.lookupCode : "#"+v); } catch(_){}
  VIEWS[v]();
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button[data-view]"); if (b){ S.editCarga=null; S.cicloOpen=false; route(b.dataset.view); window.scrollTo(0,0);} });
function refresh(){ // atualiza só as regiões dinâmicas, preservando formulários em edição
  const f = {painel:updPainel, cargas:updCargas, consulta:updConsulta, registros:updRegistros, cadastros:updCadastros}[S.view];
  if (f) f();
}

function allPkgs(){ const out=[]; for (const c of S.cargas) for (const p of (c.pacotes||[])) out.push({c,p,s:pkgStatus(c,p)}); return out; }
function updPainel(){
  if (!$("#pAlerts")) return;
  if (!ready()){ $("#pAlerts").innerHTML = `<p class="muted">Carregando registros…</p>`; return; }
  const today = isoToday(), ws = weekStart(today), alerts = [];
  if (!S.equip.length || !S.pessoas.length) alerts.push(["info", `<b>Comece pelos cadastros.</b> Registre a autoclave e a equipe que prepara e opera os ciclos.`, `<button class="small" data-go="cadastros">Abrir cadastros</button>`]);
  const pend = S.cargas.filter(c=>c.status==="preparada");
  if (pend.length) alerts.push(["warn", `<b>${pend.length} carga(s) sem registro do ciclo</b> (${pend.map(c=>esc(c.lote)).join(", ")}). Registre parâmetros e resultado do pacote teste <span class="art">art. 91</span>`, `<button class="small" data-open="${esc(pend[0].lote)}">Registrar</button>`]);
  const ibp = S.cargas.filter(c=>c.status==="liberada_ib");
  if (ibp.length) alerts.push(["warn", `<b>Indicador biológico em leitura</b> em ${ibp.map(c=>esc(c.lote)).join(", ")}. Lance o resultado ao fim da incubação.`, `<button class="small" data-open="${esc(ibp[0].lote)}">Lançar IB</button>`]);
  const rep = S.cargas.filter(c=>c.status==="reprovada" && (c.pacotes||[]).some(p=>!(c.usos||{})[p.codigo]));
  if (rep.length) alerts.push(["crit", `<b>Carga reprovada com pacotes não recolhidos:</b> ${rep.map(c=>esc(c.lote)).join(", ")}. Recolha e reprocesse; verifique pacotes já usados em pacientes.`, `<button class="small" data-open="${esc(rep[0].lote)}">Ver carga</button>`]);
  const semana = S.cargas.filter(c => c.data >= ws && c.data <= today && c.status !== "cancelada");
  const ibSemana = semana.find(c => c.ciclo?.ib?.usado);
  if (semana.length && !ibSemana) alerts.push(["crit", `<b>Nenhum indicador biológico nesta semana.</b> O monitoramento semanal exige pacote teste com IB + integrador tipo 5 ou 6 no primeiro ciclo do dia <span class="art">art. 89</span>`, ""]);
  else if (ibSemana) alerts.push(["ok", `Indicador biológico semanal feito em ${br(ibSemana.data)} (lote ${esc(ibSemana.lote)}).`, ""]);
  else if (S.equip.length) alerts.push(["info", `Primeiro ciclo da semana ainda não feito: inclua o indicador biológico no pacote teste <span class="art">art. 89</span>`, ""]);
  for (const e of S.equip.filter(e=>e.vacuo && e.ativo!==false)){
    const hoje = S.cargas.filter(c=>c.data===today && c.equipamentoId===e.id && c.ciclo);
    if (hoje.length && !hoje.some(c=>c.ciclo.bowieDick && c.ciclo.bowieDick!=="na")) alerts.push(["warn", `<b>${esc(e.nome)}</b>: autoclave com bomba de vácuo sem teste Bowie & Dick registrado hoje <span class="art">art. 88</span>`, ""]);
  }
  $("#pAlerts").innerHTML = alerts.map(([k,t,b]) => `<div class="alert ${k}"><div class="grow">${t}</div>${b}</div>`).join("");
  const pk = allPkgs();
  const disp = pk.filter(x=>x.s.t==="Disponível").length, venc30 = pk.filter(x=>x.s.k==="warn").length;
  const vencidos = pk.filter(x=>x.s.t.startsWith("Vencido")).length;
  const mes = today.slice(0,7); const usadosMes = pk.filter(x=>x.s.uso?.desfecho==="utilizado" && (x.s.uso.data||"").startsWith(mes)).length;
  $("#pTiles").innerHTML = `
    <div class="tile"><div class="n">${disp}</div><div class="l">pacotes estéreis disponíveis</div></div>
    <div class="tile ${venc30?"warn":""}"><div class="n">${venc30}</div><div class="l">vencem em até 30 dias</div></div>
    <div class="tile ${vencidos?"crit":""}"><div class="n">${vencidos}</div><div class="l">vencidos, reprocessar</div></div>
    <div class="tile"><div class="n">${usadosMes}</div><div class="l">usados em pacientes no mês</div></div>`;
  const acao = pk.filter(x=>x.s.k==="crit"||x.s.k==="warn").sort((a,b)=>a.c.validade<b.c.validade?-1:1).slice(0,40);
  $("#pPkgs").innerHTML = acao.length ? pkgTable(acao) : `<div class="empty"><h3>Nenhum pacote vencido ou a recolher</h3>Pacotes aparecem aqui 30 dias antes do vencimento ou quando a carga é reprovada.</div>`;
  const rec = S.cargas.slice(0,8);
  $("#pRecent").innerHTML = rec.length ? cargasTable(rec) : `<div class="empty"><h3>Nenhuma carga registrada</h3>Crie a primeira carga em <b>Cargas e etiquetas</b>: o sistema gera o lote, as etiquetas com QR e o registro do ciclo.</div>`;
}

    rows.map(({c,p,s})=>`<tr class="click" data-code="${esc(p.codigo)}"><td class="mono">${esc(p.codigo)}</td><td>${esc(p.kit)}</td><td>${br(c.data)}</td><td>${br(c.validade)}</td><td><span class="pill ${s.k}">${esc(s.t)}</span></td></tr>`).join("")}</tbody></table></div>`;

function novaCarga(){
  const eq = S.equip.filter(e=>e.ativo!==false);
  S.editCarga = { novo:true, data:isoToday(), equipamentoId: eq[0]?.id || "", operadorId:"", obs:"",
    grupos:[{k:uid(), kitId:"", kit:"", itens:"", qtd:1, preparadoPorId:"", embalagem:EMBALAGENS[0]}] };
  S.cargaSel = null; route("cargas");
}
function editarCarga(c){
  const grupos = []; for (const p of c.pacotes||[]){ const last = grupos[grupos.length-1];
    if (last && last.kit===p.kit && last.itens===p.itens && last.preparadoPorId===p.preparadoPorId && last.embalagem===p.embalagem) last.qtd++;
    else grupos.push({k:uid(), kitId:p.kitId||"", kit:p.kit, itens:p.itens||"", qtd:1, preparadoPorId:p.preparadoPorId||"", embalagem:p.embalagem}); }
  S.editCarga = { novo:false, lote:c.lote, data:c.data, equipamentoId:c.equipamentoId, operadorId:c.operadorId, obs:c.obs||"", grupos };
  route("cargas");
}

function onGrupoInput(e){
  const row = e.target.closest(".pk-row"); if (!row) return; const g = S.editCarga.grupos.find(x=>x.k===row.dataset.k); const f = e.target.dataset.f;
  if (f === "kitId"){ g.kitId = e.target.value; const k = S.kits.find(x=>x.id===g.kitId);
    if (k){ g.kit = k.nome; g.itens = k.itens||""; if (k.embalagem) g.embalagem = k.embalagem; } else { g.kit = ""; g.itens = ""; } drawGrupos(); return; }
  if (f === "itens"){ if (g.kitId) g.itens = e.target.value; else { const v = e.target.value; const i = v.indexOf(":"); g.kit = (i>=0?v.slice(0,i):v).trim(); g.itens = i>=0?v.slice(i+1).trim():""; } }
  else if (f === "qtd") g.qtd = Math.max(1, Math.min(60, parseInt(e.target.value)||1));
  else g[f] = e.target.value;
  $("#gTotal").textContent = S.editCarga.grupos.reduce((s,g)=>s+(+g.qtd||0),0) + " pacote(s) no total";
}
async function salvarCarga(){
  const E = S.editCarga; E.data = $("#fData").value; E.equipamentoId = $("#fEquip").value; E.operadorId = $("#fOper").value; E.obs = $("#fObs").value.trim();
  const errs = [];
  if (!E.data) errs.push("Informe a data."); if (!E.equipamentoId) errs.push("Selecione a autoclave."); if (!E.operadorId) errs.push("Selecione o operador.");
  E.grupos.forEach((g,i)=>{ if(!g.kit) errs.push(`Pacote ${i+1}: escolha o kit ou digite o nome.`); if(!g.preparadoPorId) errs.push(`Pacote ${i+1}: informe quem preparou.`); });
  const total = E.grupos.reduce((s,g)=>s+g.qtd,0); if (total > 99) errs.push("Máximo de 99 pacotes por carga.");
  if (errs.length){ $("#fErr").innerHTML = `<div class="alert crit"><div class="grow">${errs.map(esc).join("<br>")}</div></div>`; return; }
  const eq = S.equip.find(x=>x.id===E.equipamentoId);
  const lote = E.lote || "";
  const pacotes = []; let n = 1;
  for (const g of E.grupos) for (let i=0;i<g.qtd;i++) pacotes.push({ codigo: lote ? `${lote}-P${pad(n++)}` : "", kitId:g.kitId||"", kit:g.kit, itens:g.itens,
    embalagem:g.embalagem, preparadoPorId:g.preparadoPorId, preparadoPor:pessoaNome(g.preparadoPorId) });
  const validade = addMonths(E.data, +S.config.validadeMeses || 6);
  const body = { lote, data:E.data, validade, equipamentoId:E.equipamentoId, equipamentoNome:eq?.nome||"", equipamentoVacuo:!!eq?.vacuo,
    operadorId:E.operadorId, operadorNome:pessoaNome(E.operadorId), obs:E.obs, pacotes };
  const btn = $("#cForm button[type=submit]"); if (btn){ btn.disabled = true; btn.textContent = "Salvando…"; }
  const ok = await write(async () => {
    const c = E.novo ? await api("novaCarga", {dados: body}) : await api("update", {col:"cargas", id:lote, dados:{...body, editadoEm:new Date().toISOString()}});
    upsertLocal(c); return c;
  }, c => E.novo ? `Lote ${c.lote} criado com ${pacotes.length} pacote(s).` : "Carga atualizada. Reimprima as etiquetas.");
  if (btn){ btn.disabled = false; btn.textContent = E.novo ? "Gerar lote e etiquetas" : "Salvar alterações"; }
  if (ok){ S.editCarga = null; S.cargaSel = ok.lote; S.cicloOpen = false; route("cargas"); }
}

/* ---------- detalhe da carga ---------- */
const curCarga = () => S.cargas.find(c=>c.lote===S.cargaSel);
function mountCargaDetail(){

}
const RES = {aprovado:"Aprovado (virou)", reprovado:"Reprovado", na:"Não se aplica", pendente:"Em incubação", negativo:"Negativo (sem crescimento)", positivo:"Positivo (crescimento)"};

function openCiclo(){
  const c = curCarga(); if (!c) return; S.cicloOpen = true; const ci = c.ciclo || {}; const ib = ci.ib||{};
  const wk = weekStart(c.data), primeiroSemana = !S.cargas.some(x=>x.lote!==c.lote && x.data>=wk && x.data<=c.data && x.ciclo && x.status!=="cancelada" && (x.data<c.data || x.lote<c.lote));
  const primeiroDia = !S.cargas.some(x=>x.lote!==c.lote && x.data===c.data && x.equipamentoId===c.equipamentoId && x.ciclo && x.lote<c.lote);
  const bdDefault = ci.bowieDick || (c.equipamentoVacuo && primeiroDia ? "" : "na");

      <label class="f">Hora fim<input id="kFim" type="time" value="${esc(ci.horaFim||"")}"></label>
      <label class="f">Nº do ciclo no equipamento<input id="kCont" value="${esc(ci.contador||"")}" placeholder="Opcional"></label>
    </div>
    <fieldset><legend>Parâmetros físicos <span class="art">art. 91 §1º</span></legend><div class="grid g4">
      <label class="f">Temperatura (°C)<input id="kTemp" type="number" step="0.1" value="${esc(ci.temperatura??"")}" required></label>
      <label class="f">Pressão<input id="kPres" type="number" step="0.01" value="${esc(ci.pressao??"")}" required></label>
      <label class="f">Unidade<select id="kUn">${["kgf/cm²","kPa","bar","psi"].map(u=>`<option ${u===(ci.pressaoUnid||"kgf/cm²")?"selected":""}>${u}</option>`).join("")}</select></label>
      <label class="f">Tempo de exposição (min)<input id="kTempo" type="number" step="1" value="${esc(ci.tempo??"")}" required></label>
    </div></fieldset>
    <fieldset><legend>Pacote teste</legend><div class="grid ${c.equipamentoVacuo?"g3":"g2"}">
      ${c.equipamentoVacuo?`<label class="f">Bowie & Dick (1º ciclo do dia, art. 88)<select id="kBD">${["","na","aprovado","reprovado"].map(v=>`<option value="${v}" ${v===bdDefault?"selected":""}>${v?RES[v]:"Selecione…"}</option>`).join("")}</select></label>`:`<input type="hidden" id="kBD" value="na">`}
      <label class="f">Integrador químico<select id="kIntT"><option value="5" ${ci.integrador?.tipo!=6?"selected":""}>Tipo 5</option><option value="6" ${ci.integrador?.tipo==6?"selected":""}>Tipo 6</option></select></label>
      <label class="f">Resultado do integrador<select id="kIntR">${["","aprovado","reprovado"].map(v=>`<option value="${v}" ${v===(ci.integrador?.resultado||"")?"selected":""}>${v?RES[v]:"Selecione…"}</option>`).join("")}</select></label>
    </div>
    <div style="margin-top:12px"><label class="row" style="gap:8px;font-weight:500"><input type="checkbox" id="kIB" style="width:auto" ${ib.usado||(!ci.integrador&&primeiroSemana)?"checked":""}> Indicador biológico incluído neste ciclo</label></div>
    <div class="grid g4" id="ibFields" style="margin-top:10px">
      <label class="f">Lote do IB<input id="kIBL" value="${esc(ib.loteIB||"")}"></label>
      <label class="f">Resultado do IB<select id="kIBR">${["pendente","negativo","positivo"].map(v=>`<option value="${v}" ${v===(ib.resultado||"pendente")?"selected":""}>${RES[v]}</option>`).join("")}</select></label>
      <label class="f">Controle positivo<select id="kIBC"><option value="">—</option><option value="ok" ${ib.controle==="ok"?"selected":""}>Cresceu (válido)</option><option value="falha" ${ib.controle==="falha"?"selected":""}>Não cresceu (inválido)</option></select></label>
      <label class="f">Data/hora da leitura<input id="kIBD" type="datetime-local" value="${esc(ib.leitura||"")}"></label>
    </div></fieldset>
    <div class="grid g2">
      <label class="f">Interpretação<textarea id="kInt" placeholder="Ex.: Parâmetros dentro do especificado, integrador virou. Carga liberada.">${esc(ci.interpretacao||"")}</textarea></label>
      <label class="f">Registrado por<select id="kReg">${optList(S.pessoas.filter(p=>p.ativo!==false), S.pessoas.find(p=>p.nome===ci.registradoPor)?.id || c.operadorId, "Selecione…")}</select></label>
    </div>
    <div id="kErr"></div>
    <div class="row"><button type="submit" class="primary">Salvar registro</button><button type="button" data-act="cancelCiclo">Cancelar</button></div></form>`;
  const tog = () => { $("#ibFields").hidden = !$("#kIB").checked; }; tog(); $("#kIB").addEventListener("change", tog);
  $("#cicloForm").addEventListener("submit", e=>{ e.preventDefault(); salvarCiclo(); });

async function salvarCiclo(){
  const c = curCarga(); const v = id => $(id).value.trim(); const errs = [];
  const ciclo = { programa:v("#kProg"), horaInicio:v("#kIni"), horaFim:v("#kFim"), contador:v("#kCont"),
    temperatura: v("#kTemp")===""?null:+v("#kTemp"), pressao: v("#kPres")===""?null:+v("#kPres"), pressaoUnid:v("#kUn"), tempo: v("#kTempo")===""?null:+v("#kTempo"),
    bowieDick:v("#kBD"), integrador:{tipo:+v("#kIntT"), resultado:v("#kIntR")},
    ib: $("#kIB").checked ? {usado:true, loteIB:v("#kIBL"), resultado:v("#kIBR"), controle:v("#kIBC"), leitura:v("#kIBD")} : {usado:false},
    interpretacao:v("#kInt"), registradoPor:pessoaNome(v("#kReg")), registradoEm:new Date().toISOString() };
  if (ciclo.temperatura==null || ciclo.pressao==null || ciclo.tempo==null) errs.push("Preencha temperatura, pressão e tempo.");
  if (!ciclo.integrador.resultado) errs.push("Informe o resultado do integrador químico.");
  if (!ciclo.bowieDick) errs.push("Informe o Bowie & Dick (ou “Não se aplica”).");
  if (!v("#kReg")) errs.push("Informe quem está registrando.");
  if (ciclo.ib.usado && ciclo.ib.resultado!=="pendente" && ciclo.ib.controle==="falha") errs.push("Controle positivo não cresceu: o teste é inválido. Repita o IB antes de lançar o resultado.");
  if (errs.length){ $("#kErr").innerHTML = `<div class="alert crit"><div class="grow">${errs.map(esc).join("<br>")}</div></div>`; return; }
  if (!ciclo.interpretacao){ const st = computeStatus(ciclo);
    ciclo.interpretacao = st==="reprovada" ? "Falha no monitoramento. Carga reprovada; pacotes recolhidos para reprocessamento." :
      st==="liberada_ib" ? "Parâmetros e integrador conformes. Carga liberada; indicador biológico em incubação." : "Parâmetros físicos e indicadores conformes. Carga liberada."; }
  const status = computeStatus(ciclo);
  const ok = await write(async()=>{ const r = await api("update",{col:"cargas", id:c.lote, dados:{ciclo, status, liberadoEm: status.startsWith("liberada")?(c.liberadoEm||ciclo.registradoEm):null}}); upsertLocal(r); return r; },
    status==="reprovada" ? "Carga marcada como reprovada." : "Registro do ciclo salvo.");
  if (ok){ S.cicloOpen = false; updCargaDetail(); }
}

/* ---------- etiquetas ---------- */
const FMT = { "50x30":{w:50,h:30}, "60x40":{w:60,h:40}, "a4":{w:63.5,h:29.6, sheet:true, cols:3, rows:9, mx:7.2, my:15.2, gx:2.5, gy:0} };
function labelLines(c,p){ const l = [ ["h","OROCLIN · ESTERILIZADO"], ["k",p.kit] ];
  if (!TRANSPARENTE(p.embalagem) && p.itens) l.push(["it",p.itens]);
  l.push(["t",`Esterilizado: ${brShort(c.data)}`], ["v",`Validade: ${brShort(c.validade)}`], ["t",`Lote: ${c.lote}`], ["t",`Prep.: ${p.preparadoPor}`]); return l; }
function drawLabelPreview(c){
  const prev = $("#lblPrev"); if (!prev) return;
  const list = (c.pacotes||[]); const shown = list.slice(0,6);
  prev.innerHTML = shown.map(p=>`<div class="lbl"><div class="qr">${qrSvg(qrUrl(p.codigo))}<div class="code">${esc(p.codigo.split("-").slice(1).join("-"))}</div></div><div class="t">${
    labelLines(c,p).map(([k,t])=> k==="h"?`<div class="h">${esc(t)}</div>`:k==="k"?`<div class="k">${esc(t)}</div>`:k==="it"?`<div class="it">${esc(t)}</div>`:k==="v"?`<div><b>${esc(t)}</b></div>`:`<div>${esc(t)}</div>`).join("")}</div></div>`).join("")
    + (list.length>6?`<div class="hint" style="align-self:center">+ ${list.length-6} etiqueta(s) no PDF</div>`:"");
}
function pdfLabel(doc, x, y, w, h, c, p){
  const m = 1.6, qs = Math.min(h - 2*m - 3.2, w*0.42);
  const q = qrMatrix(qrUrl(p.codigo)), cell = qs / q.n; doc.setFillColor(0,0,0);
  for (let r=0;r<q.n;r++) for (let col=0;col<q.n;col++) if (q.dark(r,col)) doc.rect(x+m+col*cell, y+m+r*cell, cell+0.01, cell+0.01, "F");
  doc.setFont("courier","bold"); doc.setFontSize(Math.max(5, h/6.3)); doc.text(p.codigo.split("-").slice(1).join("-"), x+m+qs/2, y+m+qs+2.6, {align:"center"});
  const tx = x + m + qs + 2, tw = w - (tx - x) - m; let ty = y + m + 2.2; const base = h >= 38 ? 7.6 : 6.2, lh = base*0.42;
  for (const [k,t] of labelLines(c,p)){
    if (k==="h"){ doc.setFont("helvetica","bold"); doc.setFontSize(base-1.2); }
    else if (k==="k"){ doc.setFont("helvetica","bold"); doc.setFontSize(base+0.8); }
    else if (k==="it"){ doc.setFont("helvetica","normal"); doc.setFontSize(base-1.6); }
    else if (k==="v"){ doc.setFont("helvetica","bold"); doc.setFontSize(base); }
    else { doc.setFont("helvetica","normal"); doc.setFontSize(base); }
    const lines = doc.splitTextToSize(String(t), tw).slice(0, k==="it"?2:(k==="k"?2:1));
    for (const ln of lines){ if (ty > y + h - m) break; doc.text(ln, tx, ty); ty += (k==="it"? lh*0.8 : lh) + 0.15; }
    if (k==="it") ty += 0.5;
  }
}
async function pdfLabels(){
  const c = curCarga(); if (!c) return; const f = FMT[$("#lblFmt").value]; const { jsPDF } = window.jspdf;
  let doc;
  if (f.sheet){ doc = new jsPDF({unit:"mm", format:"a4"}); let i = 0;
    for (const p of c.pacotes){ const per = f.cols*f.rows; if (i && i%per===0) doc.addPage(); const k = i%per, col = k%f.cols, row = Math.floor(k/f.cols);
      pdfLabel(doc, f.mx + col*(f.w+f.gx), f.my + row*(f.h+f.gy), f.w, f.h, c, p); i++; } }
  else { doc = new jsPDF({unit:"mm", format:[f.w,f.h], orientation:"landscape"});
    c.pacotes.forEach((p,i)=>{ if (i) doc.addPage([f.w,f.h],"landscape"); pdfLabel(doc,0,0,f.w,f.h,c,p); }); }
  await save(`etiquetas_${c.lote}.pdf`, doc.output("blob"));
}

/* ======================= CONSULTA ======================= */
function mountConsulta(){
  $("#main").innerHTML = `<div class="stack">
    <div><h1>Consultar pacote</h1><p class="lede">Aponte a câmera do celular para o QR da etiqueta: a ficha abre direto aqui. Também dá para ler por foto ou digitar o código. A ficha mostra todo o histórico do pacote para a fiscalização e permite registrar o uso no paciente.</p></div>
    <form id="qForm" class="panel scan" novalidate>
      <label class="f">Código do pacote<input id="qCode" class="mono" placeholder="L20261026-01-P03" autocomplete="off" value="${esc(S.lookupCode||"")}"></label>
      <button type="submit" class="primary">Consultar</button>
      <span class="btn filebtn">Ler QR por foto<input type="file" id="qFile" accept="image/*" capture="environment" aria-label="Foto do QR code"></span>
    </form>
    <div id="qRes"></div></div>`;
  $("#qForm").addEventListener("submit", e=>{ e.preventDefault(); lookup($("#qCode").value); });
  $("#qFile").addEventListener("change", e=>{ const f = e.target.files[0]; if (f) scanFile(f); e.target.value=""; });
  if (S.lookupCode) lookup(S.lookupCode); else $("#qRes").innerHTML = `<div class="empty"><h3>Nenhum pacote consultado</h3>O código fica abaixo do QR na etiqueta, no formato <span class="mono">L</span>+data+sequência da carga+<span class="mono">P</span>+número do pacote.</div>`;
}
function scanFile(file){
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => { const max = 1400, sc = Math.min(1, max/Math.max(img.width,img.height)); const cv = document.createElement("canvas");
    cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc); const cx = cv.getContext("2d"); cx.drawImage(img,0,0,cv.width,cv.height);
    URL.revokeObjectURL(url); const r = jsQR(cx.getImageData(0,0,cv.width,cv.height).data, cv.width, cv.height, {inversionAttempts:"attemptBoth"});
    if (r && CODE_RE.test(r.data)){ $("#qCode").value = r.data.match(CODE_RE)[0]; lookup(r.data); }
    else toast("QR não reconhecido. Aproxime a câmera, evite reflexo ou digite o código."); };
  img.onerror = () => toast("Não foi possível abrir a imagem.");
  img.src = url;
}
async function lookup(raw){
  const m = String(raw||"").toUpperCase().match(CODE_RE);
  if (!m){ $("#qRes").innerHTML = `<div class="alert crit"><div class="grow">Código inválido. O formato é como <span class="mono">L20261026-01-P03</span>.</div></div>`; return; }
  S.lookupCode = m[0]; const lote = loteFromCode(m[0]);
  let c = S.cargas.find(x=>x.lote===lote);
  if (!c){ $("#qRes").innerHTML = `<p class="muted">Buscando…</p>`; c = await api("get",{col:"cargas", id:lote}).catch(()=>null); }
  S.lookupCarga = c || null; S.usoOpen = false; renderFicha();
}
function updConsulta(){ if (!S.lookupCode || !$("#qRes") || S.usoOpen) return; const c = S.cargas.find(x=>x.lote===loteFromCode(S.lookupCode)); if (c){ S.lookupCarga = c; renderFicha(); } }
function renderFicha(){
  const c = S.lookupCarga, code = S.lookupCode, box = $("#qRes"); if (!box) return;
  const p = c && (c.pacotes||[]).find(x=>x.codigo===code);
  if (!c || !p){ box.innerHTML = `<div class="alert crit"><div class="grow">Pacote <span class="mono">${esc(code)}</span> não encontrado nos registros.</div></div>`; return; }
  const s = pkgStatus(c,p), u = s.uso, ci = c.ciclo;
  box.innerHTML = `<div class="split">
    <section class="panel stack"><div class="row between"><div><div class="eyebrow">Ficha de rastreabilidade</div><h2 class="mono">${esc(code)}</h2></div><span class="pill ${s.k}">${esc(s.t)}</span></div>
      <dl class="kv">
        <dt>Pacote</dt><dd><b>${esc(p.kit)}</b>${p.itens?` · ${esc(p.itens)}`:""}</dd>
        <dt>Embalagem</dt><dd>${esc(p.embalagem)}</dd>
        <dt>Preparado por</dt><dd>${esc(p.preparadoPor)}</dd>
        <dt>Data da esterilização</dt><dd>${br(c.data)}</dd>
        <dt>Validade</dt><dd>${br(c.validade)}</dd>
        <dt>Lote da carga</dt><dd class="mono"><button class="link" data-open="${esc(c.lote)}">${esc(c.lote)}</button></dd>
        <dt>Autoclave</dt><dd>${esc(c.equipamentoNome)}</dd>
        <dt>Operador</dt><dd>${esc(c.operadorNome)}</dd>
        <dt>Situação da carga</dt><dd>${cargaPill(c)}</dd>
        ${ci?`<dt>Parâmetros</dt><dd class="mono">${esc(ci.temperatura)} °C · ${esc(ci.pressao)} ${esc(ci.pressaoUnid)} · ${esc(ci.tempo)} min</dd>
        <dt>Integrador</dt><dd>Tipo ${esc(ci.integrador?.tipo)} · ${esc(RES[ci.integrador?.resultado])}</dd>
        ${ci.bowieDick && ci.bowieDick!=="na"?`<dt>Bowie & Dick</dt><dd>${esc(RES[ci.bowieDick])}</dd>`:""}

  $("#main").innerHTML = `<div class="stack">
    <div><h1>Livro de registros da esterilização</h1><p class="lede">Registro de monitoramento de cada carga com os 7 itens mínimos do art. 91. Guarde por no mínimo 5 anos <span class="art">art. 92</span>: exporte o mês em PDF e CSV e arquive.</p></div>

      <label class="f" style="width:180px">Mês<input type="month" id="rMes" value="${esc(S.regMes)}"></label>

async function loadReg(){
  const m = S.regMes; if (!m){ S.regRows = []; return updRegistros(); }
  const ini = m+"-01", fim = m+"-31";
  const local = S.cargas.filter(c=>c.data>=ini && c.data<=fim);
  S.regRows = local; updRegistros();
  try { S.regRows = await api("consulta",{de:ini, ate:fim}); updRegistros(); } catch(_){}
}
function regFiltered(){ return (S.regRows||[]).filter(c=>c.status!=="cancelada" && (!S.regEquip || c.equipamentoId===S.regEquip)).sort((a,b)=>a.lote<b.lote?-1:1); }
function updRegistros(){
  if (!$("#rList")) return; if (S.regRows==null) return;
  if (S.regRows && S.regMes){ const ini=S.regMes+"-01", fim=S.regMes+"-31"; const byId = new Map(S.regRows.map(r=>[r.lote,r])); S.cargas.filter(c=>c.data>=ini&&c.data<=fim).forEach(c=>byId.set(c.lote,c)); S.regRows=[...byId.values()]; }
  const rows = regFiltered();
  $("#rList").innerHTML = rows.length ? `<div class="tablewrap"><table><thead><tr><th>Data</th><th>Lote</th><th>Autoclave</th><th>Operador</th><th>Parâmetros (T · P · t)</th><th>Pacote teste</th><th class="num">Pacotes</th><th>Situação</th></tr></thead><tbody>${
    rows.map(c=>{ const ci=c.ciclo; return `<tr class="click" data-open="${esc(c.lote)}"><td>${br(c.data)}</td><td class="mono">${esc(c.lote)}</td><td>${esc(c.equipamentoNome)}</td><td>${esc(c.operadorNome)}</td>
      <td class="mono">${ci?`${esc(ci.temperatura)} °C · ${esc(ci.pressao)} ${esc(ci.pressaoUnid)} · ${esc(ci.tempo)} min`:"—"}</td>
      <td>${ci?`${ci.bowieDick && ci.bowieDick!=="na"?`BD ${esc(RES[ci.bowieDick])} · `:""}Int. T${esc(ci.integrador?.tipo)} ${esc(ci.integrador?.resultado==="aprovado"?"OK":"falha")}${ci.ib?.usado?` · IB ${esc(RES[ci.ib.resultado])}`:""}`:`<span class="pill info">Sem registro</span>`}</td>
      <td class="num">${(c.pacotes||[]).length}</td><td>${cargaPill(c)}</td></tr>`; }).join("")}</tbody></table></div>`
    : `<div class="empty"><h3>Nenhuma carga em ${esc(S.regMes?S.regMes.split("-").reverse().join("/"):"")}</h3>As cargas registradas no mês aparecem aqui.</div>`;
}
const pdfUn = u => String(u||"").replace("²","2");
function regRecords(){ return regFiltered().map(c=>{ const ci=c.ciclo||{}; return { _c:c,
  data:br(c.data), lote:c.lote, equipamento:c.equipamentoNome, operador:c.operadorNome,
  parametros: ci.temperatura!=null?`${ci.temperatura} °C | ${ci.pressao} ${pdfUn(ci.pressaoUnid)} | ${ci.tempo} min`:"",
  ciclo:`${ci.programa||""} ${ci.horaInicio||""}-${ci.horaFim||""}`.trim(),
  teste: ci.integrador?`${ci.bowieDick && ci.bowieDick!=="na"?`B&D: ${RES[ci.bowieDick]}; `:""}Integrador T${ci.integrador.tipo}: ${RES[ci.integrador.resultado]}; IB: ${ci.ib?.usado?RES[ci.ib.resultado]+(ci.ib.loteIB?" (lote "+ci.ib.loteIB+")":""):"não incluído"}`:"Sem registro",
  interpretacao: ci.interpretacao||"", pacotes:(c.pacotes||[]).map(p=>`${p.codigo.split("-").pop()} ${p.kit} (prep. ${p.preparadoPor})`).join("; "),
  situacao:(CARGA_STATUS[c.status]||[c.status])[0] }; }); }
function regCsv(){ const r = regRecords(); if (!r.length) return toast("Nenhuma carga no período.");
  const head = ["Data","Lote","Equipamento","Operador","Parâmetros físicos","Ciclo","Resultado do pacote teste","Interpretação","Pacotes esterilizados","Situação"];
  const q = v => `"${String(v).replace(/"/g,'""')}"`;
  const csv = "﻿" + [head.map(q).join(";"), ...r.map(x=>[x.data,x.lote,x.equipamento,x.operador,x.parametros,x.ciclo,x.teste,x.interpretacao,x.pacotes,x.situacao].map(q).join(";"))].join("\r\n");
  save(`registro_esterilizacao_${S.regMes}.csv`, csv); }
/* Fotos dos indicadores de uma carga, na ordem em que entram no anexo. */
function fotosCarga(c){ const f = (c.ciclo||{}).fotos || {}, ci = c.ciclo || {}, out = [];
  if (f.integrador) out.push({...f.integrador, tipo:"integrador", titulo:`Integrador químico T${ci.integrador?.tipo||""}`, resultado:RES[ci.integrador?.resultado]||"—"});
  if (f.ib) out.push({...f.ib, tipo:"ib", titulo:"Indicador biológico · testado e controle", resultado:`${RES[ci.ib?.resultado]||"—"}${ci.ib?.controle==="ok"?" · controle válido":""}${ci.ib?.loteIB?" · lote IB "+ci.ib.loteIB:""}`});
  return out; }
function regPdf(){ const r = regRecords(); if (!r.length) return toast("Nenhuma carga no período.");
  const { jsPDF } = window.jspdf; const doc = new jsPDF({unit:"mm", format:"a4", orientation:"landscape"});
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 12, base = H - 14;
  const head = [["Data","Lote","Equipamento","Operador","Parâmetros físicos","Resultado e interpretação do pacote teste","Pacotes esterilizados","Situação"]];
  // larguras fixas: a mesma grade em todas as cargas, para o livro ler como uma tabela só
  const cw = {0:19, 1:27, 2:23, 3:22, 4:30, 5:66, 6:66, 7:20};
  const colStyles = Object.fromEntries(Object.entries(cw).map(([k,w])=>[k,{cellWidth:w}])); colStyles[1].font = "courier";
  const style = {fontSize:7, cellPadding:1.6, valign:"top", lineColor:[200,200,200], lineWidth:0.15};
  const cab = () => { const lg = pdfLogo(doc, M, 5, 13);
    doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(0); doc.text("Registro de monitoramento da esterilização", M + lg + 5, 15);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(90);
    doc.text(`Período: ${S.regMes.split("-").reverse().join("/")} · ${S.regEquip?"Autoclave: "+(S.equip.find(e=>e.id===S.regEquip)?.nome||""):"Todas as autoclaves"} · RDC Anvisa nº 1.002/2025, arts. 89 a 92 · emitido em ${new Date().toLocaleString("pt-BR")}`, M, 21);
    doc.setTextColor(0); return 25; };
  // altura de uma linha da tabela, calculada antes de desenhar, para decidir a quebra de página
  const rowH = cells => { doc.setFont("helvetica","normal"); doc.setFontSize(7); let n = 1;
    cells.forEach((t,i)=>{ n = Math.max(n, doc.splitTextToSize(String(t), cw[i] - 3.2).length); }); return n * 7 * 0.3528 * 1.15 + 3.4; };
  const PH = 46, PW = PH * 4/3, CAP = 62, FOTO_BLOCO = PH + 5;   // foto 61 × 46 mm, legenda ao lado
  let y = cab(), topo = true;
  r.forEach(x => {
    const cells = [x.data,x.lote,x.equipamento,x.operador,x.parametros,x.teste+(x.interpretacao?"\n"+x.interpretacao:""),x.pacotes,x.situacao];
    const fotos = fotosCarga(x._c), precisa = 8 + rowH(cells) + (fotos.length ? FOTO_BLOCO : 9) + 4;
    if (!topo && y + precisa > base){ doc.addPage(); y = cab(); topo = true; }
    doc.autoTable({ startY:y, margin:{left:M, right:M}, head, showHead:"firstPage", body:[cells], styles:style,
      headStyles:{fillColor:[23,21,15], textColor:255}, bodyStyles:{fillColor:[247,245,239]}, columnStyles:colStyles,
      didParseCell:d=>{ if (d.section==="body" && d.column.index===7 && /Reprovada/.test(d.cell.raw)) { d.cell.styles.textColor=[180,30,30]; d.cell.styles.fontStyle="bold"; } } });
    y = doc.lastAutoTable.finalY; topo = false;
    // faixa das fotos, presa à linha da carga
    const h = fotos.length ? FOTO_BLOCO : 9;
    doc.setDrawColor(200); doc.setLineWidth(0.15); doc.rect(M, y, W - 2*M, h);
    doc.setFillColor(190,160,90); doc.rect(M, y, 1.2, h, "F");
    if (!fotos.length){ doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(180,30,30); doc.text("Sem foto dos indicadores registrada para esta carga.", M + 5, y + 5.8); doc.setTextColor(0); }
    fotos.forEach((f, i) => { const fx = M + 4 + i * (PW + CAP + 6), fy = y + 2.5;
      try { doc.addImage(f.src, "JPEG", fx, fy, PW, PH, undefined, "FAST"); } catch(_) { doc.setFontSize(8); doc.text("Foto indisponível", fx + PW/2, fy + PH/2, {align:"center"}); }
      doc.setDrawColor(170); doc.rect(fx, fy, PW, PH);
      let ty = fy + 4, tx = fx + PW + 4;
      doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.text(doc.splitTextToSize(f.tipo==="ib" ? "Indicador biológico" : f.titulo, CAP), tx, ty); ty += 4.5;
      doc.setFont("helvetica","normal"); doc.setFontSize(7.5);
      if (f.tipo==="ib"){ doc.text("Ampolas testada e controle", tx, ty); ty += 4; }
      const res = doc.splitTextToSize("Resultado: " + f.resultado, CAP); doc.text(res, tx, ty); ty += 3.5 * res.length + 1.5;
      doc.setTextColor(110); doc.text(doc.splitTextToSize(`Foto em ${f.em||"—"}${f.por?"\npor "+f.por:""}`, CAP), tx, ty); doc.setTextColor(0); });
    y += h + 4;
  });
  const tot = doc.internal.getNumberOfPages();
  for (let p = 1; p <= tot; p++){ doc.setPage(p); doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(120);
    doc.text(`Página ${p} de ${tot}`, W-M, H-7, {align:"right"});
    doc.text("Responsável técnico: ______________________________   Data: ___/___/______", M, H-7); doc.setTextColor(0); }
  save(`livro_esterilizacao_${S.regMes}.pdf`, doc.output("blob")); }

  $("#fmEquip").addEventListener("submit", async e=>{ e.preventDefault(); const n = $("#eqNome").value.trim(); if(!n) return toast("Dê um nome à autoclave.");
    if (await add("equipamentos",{nome:n, modelo:$("#eqModelo").value.trim(), serie:$("#eqSerie").value.trim(), vacuo:false},"Autoclave adicionada.")) e.target.reset(); });
  $("#fmPes").addEventListener("submit", async e=>{ e.preventDefault(); const n = $("#pNome").value.trim(); if(!n) return toast("Informe o nome.");
    if (await add("pessoas",{nome:n, funcao:$("#pFun").value},"Pessoa adicionada.")) e.target.reset(); });
  $("#fmKit").addEventListener("submit", async e=>{ e.preventDefault(); const n = $("#kNome").value.trim(); if(!n) return toast("Informe o nome do kit.");
    if (await add("kits",{nome:n, itens:$("#kItens").value.trim(), embalagem:$("#kEmb").value},"Kit adicionado.")) e.target.reset(); });
  $("#fmVal").addEventListener("submit", async e=>{ e.preventDefault(); const v = Math.max(1, Math.min(12, parseInt($("#cfVal").value)||6));
    await write(()=>api("set",{col:"config", id:"geral", dados:{...S.config, validadeMeses:v}}), `Prazo de validade: ${v} meses (vale para novas cargas).`); });
  updCadastros();
}
const CAD_FORM = {
  equipamentos: { form:"#fmEquip", campos:{eqNome:"nome", eqModelo:"modelo", eqSerie:"serie"}, rotulo:"autoclave" },
  pessoas:      { form:"#fmPes",   campos:{pNome:"nome", pFun:"funcao"}, rotulo:"pessoa" },
  kits:         { form:"#fmKit",   campos:{kNome:"nome", kItens:"itens", kEmb:"embalagem"}, rotulo:"kit" }
};
function editarCadastro(col, id){
  const arr = {equipamentos:S.equip, pessoas:S.pessoas, kits:S.kits}[col]; const x = arr && arr.find(y=>y.id===id); const cf = CAD_FORM[col];
  if (!x || !cf) return;
  if (S.editCad) mountCadastros();
  S.editCad = {col, id};
  const f = $(cf.form);
  Object.entries(cf.campos).forEach(([el, k]) => { const i = $("#"+el); if (!i) return;
    if (i.tagName === "SELECT" && x[k] && ![...i.options].some(o=>o.value===x[k])) i.add(new Option(x[k], x[k]));
    i.value = x[k] || ""; });
  f.querySelector("button[type=submit]").textContent = "Salvar alterações";
  f.querySelector("[data-cancel-edit]").hidden = false;
  f.scrollIntoView({behavior:"smooth", block:"center"}); $("#"+Object.keys(cf.campos)[0]).focus();
  toast(`Editando ${cf.rotulo}: ${x.nome}. Cargas já registradas não mudam.`);
}
function updCadastros(){
  if (!$("#lsEquip")) return;
  const list = (arr, col, cols, empty) => arr.length ? `<div class="tablewrap"><table><tbody>${arr.map(x=>`<tr><td>${cols(x)}</td><td class="num" style="white-space:nowrap">${x.ativo===false?`<span class="pill neutral">Inativo</span> `:""}<button class="small" data-edit="${col}/${esc(x.id)}">Editar</button> <button class="small" data-toggle="${col}/${esc(x.id)}">${x.ativo===false?"Reativar":"Desativar"}</button></td></tr>`).join("")}</tbody></table></div>` : `<p class="muted" style="margin:0">${empty}</p>`;
  $("#lsEquip").innerHTML = list(S.equip,"equipamentos",x=>`<b>${esc(x.nome)}</b> <span class="muted">${esc([x.modelo,x.serie].filter(Boolean).join(" · "))}</span> ${x.vacuo?'<span class="pill info">Vácuo</span>':""}`,"Nenhuma autoclave cadastrada.");
  $("#lsPes").innerHTML = list(S.pessoas,"pessoas",x=>`<b>${esc(x.nome)}</b> <span class="muted">${esc(x.funcao||"")}</span>`,"Ninguém cadastrado ainda.");
  $("#lsKits").innerHTML = list(S.kits,"kits",x=>`<b>${esc(x.nome)}</b><div class="hint">${esc([x.itens,x.embalagem].filter(Boolean).join(" · "))}</div>`,"Nenhum kit cadastrado.");
}

/* ---------- ações globais ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act],[data-open],[data-code],[data-go],[data-toggle],[data-edit],[data-cancel-edit]"); if (!t) return;
  if (t.hasAttribute("data-cancel-edit")){ S.editCad = null; mountCadastros(); return; }
  if (t.dataset.edit){ editarCadastro(...t.dataset.edit.split("/")); return; }
  if (t.dataset.go){ route(t.dataset.go); return; }
  if (t.dataset.open){ S.cargaSel = t.dataset.open; S.editCarga = null; S.cicloOpen = false; route("cargas"); window.scrollTo(0,0); return; }
  if (t.dataset.code){ S.lookupCode = t.dataset.code; route("consulta"); window.scrollTo(0,0); return; }
  if (t.dataset.toggle){ const [col,id] = t.dataset.toggle.split("/"); const arr = {equipamentos:S.equip, pessoas:S.pessoas, kits:S.kits}[col]; const x = arr.find(y=>y.id===id);
    await write(()=>api("update",{col, id, dados:{ativo: x.ativo===false}}), x.ativo===false?"Reativado.":"Desativado."); return; }
  const a = t.dataset.act;
  if (a==="nova") novaCarga();
  else if (a==="cancelForm"){ S.editCarga = null; route("cargas"); }
  else if (a==="addGrupo"){ const last = S.editCarga.grupos[S.editCarga.grupos.length-1]; S.editCarga.grupos.push({k:uid(), kitId:"", kit:"", itens:"", qtd:1, preparadoPorId:last?.preparadoPorId||"", embalagem:EMBALAGENS[0]}); drawGrupos(); }
  else if (a==="delGrupo"){ const k = t.closest(".pk-row").dataset.k; S.editCarga.grupos = S.editCarga.grupos.filter(g=>g.k!==k); drawGrupos(); }
  else if (a==="back"){ S.cargaSel = null; S.cicloOpen = false; route("cargas"); }
  else if (a==="ciclo") openCiclo();
  else if (a==="cancelCiclo"){ S.cicloOpen = false; updCargaDetail(); }
  else if (a==="pdfLabels") pdfLabels();
  else if (a==="editCarga") editarCarga(curCarga());
  else if (a==="askCancel") $("#cancelBox").innerHTML = `<div class="confirm row between"><span>Cancelar a carga ${esc(S.cargaSel)}? O lote fica registrado como cancelado e as etiquetas impressas devem ser descartadas.</span><span class="row"><button class="danger" data-act="doCancel">Cancelar carga</button><button data-act="noCancel">Manter</button></span></div>`;
  else if (a==="noCancel") $("#cancelBox").innerHTML = "";
  else if (a==="doCancel") await write(async()=>{ const r = await api("update",{col:"cargas", id:S.cargaSel, dados:{status:"cancelada", canceladoEm:new Date().toISOString()}}); upsertLocal(r); return r; }, "Carga cancelada.");
  else if (a==="uso"){ const c = S.lookupCarga, p = c.pacotes.find(x=>x.codigo===S.lookupCode); const s = pkgStatus({...c, usos:{}}, p);
    $("#usoBox").innerHTML = usoFormHtml(c,p,s,(c.usos||{})[S.lookupCode]); bindUso(); }
  else if (a==="pdfFicha") fichaPdf();
  else if (a==="regPdf") regPdf();
  else if (a==="regCsv") regCsv();
});
window.addEventListener("hashchange", ()=>{ const h = decodeURIComponent(location.hash.replace("#","")); const m = h.match(CODE_RE);
  if (m && m[0].toUpperCase() !== S.lookupCode){ S.lookupCode = m[0].toUpperCase(); route("consulta"); } else if (VIEWS[h] && h!==S.view) route(h); });
boot();
</script>
